[package]
name = "folia-spout-sender"
version = "0.1.0"
edition = "2021"
description = "Windows Spout2 sender helper for Folia (publishes Electron offscreen shared textures as a Spout sender)"
license = "AGPL-3.0"

# serde/serde_json carry the JSONL line protocol (protocol.rs), which is pure logic and therefore
# builds and tests on any host OS.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The windows crate is target-gated so `cargo test` (pure-logic modules: cli.rs / protocol.rs /
# sender_names.rs / shared_info.rs) still builds and runs on non-Windows hosts, e.g. a Linux dev
# machine or CI lint job. Everything that touches Win32 / D3D11 / DXGI is cfg(windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
