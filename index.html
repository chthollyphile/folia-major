<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="一个动态歌词播放器，支持 AI 主题生成" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Folia" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Folia</title>
    <script src="/runtime-config.js"></script>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.3"
  }
}
</script>
    <!-- 首屏加载遮罩：内联样式，随 HTML 首帧一起绘制，不等 index.css 与 JS bundle。
         由 src/utils/appSplash.ts 在 React 挂载后淡出并移除。 -->
    <style>
      html,
      body {
        background-color: #09090b;
      }

      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #09090b;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity 320ms ease;
      }

      #app-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }

      #app-splash .app-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 28px;
        opacity: 0;
        /* 延迟淡入：命中缓存的秒开不会闪一下遮罩内容。 */
        animation: app-splash-in 420ms ease 180ms forwards;
      }

      /* 四块色块拼成的 F（版型同 public/icon.svg，配色同 build/icon-color.svg）。
         容器按 250:340 的比例定宽，色块用百分比定位，跟着视口缩放。 */
      #app-splash .app-splash-blocks {
        position: relative;
        width: clamp(88px, 15vw, 150px);
        aspect-ratio: 250 / 340;
      }

      /* 循环动画：色块像华容道一样依次滑开、再按原路滑回拼成 F。
         只做 transform 动画，合成器线程执行，不占主线程。 */
      #app-splash .app-splash-blocks span {
        position: absolute;
        border-radius: clamp(4px, 0.6vw, 6px);
        animation: 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #app-splash .app-splash-blocks .is-stem {
        left: 0;
        top: 0;
        width: 35.2%;
        height: 45.88%;
        background-color: #e3342a;
        animation-name: app-splash-stem;
      }

      #app-splash .app-splash-blocks .is-top {
        left: 40%;
        top: 0;
        width: 60%;
        height: 24.71%;
        background-color: #f7c918;
        animation-name: app-splash-top;
      }

      #app-splash .app-splash-blocks .is-middle {
        left: 0;
        top: 49.41%;
        width: 80%;
        height: 23.53%;
        background-color: #1f5bc6;
        animation-name: app-splash-middle;
      }

      #app-splash .app-splash-blocks .is-foot {
        left: 0;
        top: 76.47%;
        width: 35.2%;
        height: 23.53%;
        background-color: #ffffff;
        animation-name: app-splash-foot;
      }

      @keyframes app-splash-in {
        to {
          opacity: 1;
        }
      }

      /* 滑开的顺序：中横右移让路 → 竖笔下滑 → 顶横左移进竖笔空出的位置 → 底块右移；
         回程倒着走。位移是各色块自身尺寸的百分比，前一块让开后下一块才动，互不相撞。 */
      @keyframes app-splash-middle {
        0%,
        10%,
        84%,
        100% {
          transform: translateX(0);
        }
        18%,
        76% {
          transform: translateX(50%);
        }
      }

      @keyframes app-splash-stem {
        0%,
        18%,
        76%,
        100% {
          transform: translateY(0);
        }
        26%,
        68% {
          transform: translateY(58.97%);
        }
      }

      @keyframes app-splash-top {
        0%,
        26%,
        68%,
        100% {
          transform: translateX(0);
        }
        34%,
        60% {
          transform: translateX(-66.67%);
        }
      }

      @keyframes app-splash-foot {
        0%,
        34%,
        60%,
        100% {
          transform: translateX(0);
        }
        42%,
        52% {
          transform: translateX(113.64%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-splash .app-splash-inner {
          opacity: 1;
          animation: none;
        }

        /* 不动，保持拼好的 F。 */
        #app-splash .app-splash-blocks span {
          animation: none;
        }
      }
    </style>
</head>
  <body>
    <div id="app-splash" role="status" aria-live="polite" aria-label="Loading Folia">
      <div class="app-splash-inner">
        <div class="app-splash-blocks" aria-hidden="true">
          <span class="is-stem"></span>
          <span class="is-top"></span>
          <span class="is-middle"></span>
          <span class="is-foot"></span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          // 需要透明背景的入口不能盖遮罩：OBS 浏览器源会被直接推流捕获，
          // Electron 的透明播放背景 / 壁纸窗口（main.cjs 传 splash=0）会在桌面上闪一个黑块。
          var params = new URLSearchParams(window.location.search);
          if (params.get('obs') === '1' || window.location.pathname === '/obs' || params.get('splash') === '0') {
            var splash = document.getElementById('app-splash');
            if (splash) {
              splash.remove();
            }
            return;
          }
        } catch (error) {
          // 探测失败时保留遮罩，React 挂载后仍会移除它。
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
