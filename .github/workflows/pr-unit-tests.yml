name: PR Unit Tests

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-unit:
    name: Run unit tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      # 代码地图是生成的。这一步保证它跟代码同步——过期在结构上不可能发生。
      - name: Check code map is up to date
        run: npm run codemap:check

      - name: Run unit tests
        run: npm run test:unit

      - name: Install sync-server dependencies
        run: npm ci
        working-directory: ./sync-server

      - name: Run sync-server typecheck
        run: npm run build:node
        working-directory: ./sync-server
