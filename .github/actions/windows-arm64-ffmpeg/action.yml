name: Native Windows ARM64 FFmpeg
description: Build the audio-only runtime from checksum-pinned FFmpeg source.
runs:
  using: composite
  steps:
    - name: Cache native FFmpeg
      id: ffmpeg
      uses: actions/cache@v4
      with:
        path: build/ffmpeg/win-arm64
        key: ffmpeg-win-arm64-${{ hashFiles('packaging/ffmpeg/windows-arm64.mjs', 'packaging/ffmpeg/build-windows-arm64.sh') }}

    - name: Set up CLANGARM64
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANGARM64
        path-type: inherit
        install: >-
          make
          diffutils
          tar
          mingw-w64-clang-aarch64-clang
          mingw-w64-clang-aarch64-llvm

    - name: Compile FFmpeg
      if: steps.ffmpeg.outputs.cache-hit != 'true'
      shell: msys2 {0}
      run: npm run build:ffmpeg
